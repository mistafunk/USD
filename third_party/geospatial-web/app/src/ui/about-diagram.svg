<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-label="Pipeline: a Web Worker runs OpenUSD and a coordinate operation engine; the main thread draws the placed meshes in the SceneView">
  <!-- The About dialog's diagram (D27): how the demonstrator places models. Inserted inline
       by src/ui/about.ts, so it uses the page's colour variables; the fallbacks let it render
       on its own too. Highlighted (.key): what the geospatial CRS proposal adds. -->
  <style>
    .dg-lane { fill: var(--surface, #ffffff); stroke: var(--line-strong, #cfd4da); }
    .dg-lane-label { font: 600 10.5px var(--font, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif); fill: var(--faint, #8b929b); letter-spacing: .06em; text-transform: uppercase; }
    .dg-box { fill: #fff; stroke: var(--accent, #0b63b6); stroke-width: 1.2; rx: 5; }
    .dg-box.ext { fill: var(--surface-2, #f5f7f9); stroke: var(--line-strong, #cfd4da); stroke-dasharray: 4 3; }
    .dg-box.sdk { fill: var(--ok-bg, #e5f4ec); stroke: var(--ok, #11734b); }
    /* the novelty: geospatial CRS schema and Hydra placement */
    .dg-box.key { fill: var(--accent-bg, #e8f1fb); stroke: var(--accent, #0b63b6); stroke-width: 2.4; }
    .dg-tag { fill: var(--accent, #0b63b6); rx: 3; }
    .dg-tag-text { font: 700 8.5px var(--font, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif); fill: #fff; letter-spacing: .08em; }
    .dg-t { font: 600 12px var(--font, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif); fill: var(--text, #1f2328); }
    .dg-s { font: 10.5px var(--font, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif); fill: var(--muted, #5f6670); }
    .dg-m { font: 10.5px var(--mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace); fill: var(--accent, #0b63b6); }
    .dg-arrow { stroke: var(--muted, #5f6670); stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .dg-arrow.data { stroke: var(--accent, #0b63b6); stroke-dasharray: 5 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280" />
    </marker>
  </defs>
  <!-- input -->
  <rect class="dg-box ext" x="10" y="44" width="128" height="62" />
  <text class="dg-t" x="20" y="66">3D object layer</text>
  <text class="dg-s" x="20" y="82">feature layer with</text>
  <text class="dg-s" x="20" y="96">glb or USD models</text>

  <!-- worker lane -->
  <rect class="dg-lane" x="152" y="10" width="680" height="190" rx="6" />
  <text class="dg-lane-label" x="164" y="28">Web Worker · OpenUSD in WebAssembly</text>

  <rect class="dg-box" x="166" y="40" width="120" height="66" />
  <text class="dg-t" x="176" y="62">USD stage</text>
  <text class="dg-s" x="176" y="78">wrapper layer.usda</text>
  <text class="dg-s" x="176" y="92">injects CRS schema</text>

  <rect class="dg-box key" x="302" y="40" width="152" height="66" />
  <rect class="dg-tag" x="417" y="33" width="29" height="13" />
  <text class="dg-tag-text" x="421" y="42.5">NEW</text>
  <text class="dg-t" x="312" y="62">CRS binding</text>
  <text class="dg-s" x="312" y="78">GeospatialCRSBindingAPI</text>

  <rect class="dg-box key" x="470" y="40" width="172" height="66" />
  <rect class="dg-tag" x="605" y="33" width="29" height="13" />
  <text class="dg-tag-text" x="609" y="42.5">NEW</text>
  <text class="dg-t" x="480" y="62">Placement scene index</text>
  <text class="dg-s" x="480" y="78">Hydra, double precision</text>
  <text class="dg-s" x="480" y="92">into the output CRS</text>

  <rect class="dg-box" x="658" y="40" width="160" height="66" />
  <text class="dg-t" x="668" y="62">Mesh observer</text>
  <text class="dg-s" x="668" y="78">meshes, frames, status</text>

  <rect class="dg-box ext" x="284" y="126" width="170" height="62" />
  <text class="dg-t" x="294" y="148">CRS database · grids</text>
  <text class="dg-s" x="294" y="164">at startup · on demand</text>

  <rect class="dg-box" x="470" y="126" width="226" height="62" />
  <text class="dg-t" x="480" y="148">Coordinate operation engine</text>
  <text class="dg-s" x="480" y="164">plugin: PROJ or Esri Projection Engine</text>
  <text class="dg-s" x="480" y="178">picks the operation for the location</text>

  <path class="dg-arrow" d="M138,73 H164" />
  <path class="dg-arrow" d="M286,73 H300" />
  <path class="dg-arrow" d="M454,73 H468" />
  <path class="dg-arrow" d="M642,73 H656" />
  <path class="dg-arrow" d="M556,106 V124" />
  <path class="dg-arrow" d="M454,157 H468" />

  <!-- worker to main thread -->
  <path class="dg-arrow data" d="M738,106 V250" />
  <text class="dg-m" x="730" y="215" text-anchor="end">typed arrays</text>

  <!-- main thread lane -->
  <rect class="dg-lane" x="152" y="224" width="680" height="96" rx="6" />
  <text class="dg-lane-label" x="164" y="242">Main thread · ArcGIS Maps SDK</text>

  <rect class="dg-box" x="166" y="254" width="288" height="54" />
  <text class="dg-t" x="176" y="276">Panel</text>
  <text class="dg-s" x="176" y="292">Loaded 3DOL · Available 3DOL · Log</text>

  <rect class="dg-box sdk" x="470" y="254" width="348" height="54" />
  <text class="dg-t" x="480" y="276">SceneView · RenderNode (WebGL2)</text>
  <text class="dg-s" x="480" y="292">float32-exact origin per mesh · terrain · buildings · basemap</text>
      </svg>
