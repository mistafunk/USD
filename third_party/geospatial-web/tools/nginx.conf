# Serves the installed geospatial-web app cross-origin isolated (SharedArrayBuffer for pthreads).
server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  # The OpenUSD module ships precompressed (module/geospatialModule.wasm.gz);
  # other text compresses on the fly.
  gzip_static on;
  gzip on;
  gzip_types text/javascript text/css application/json text/plain application/wasm;
  types {
    text/html html;
    text/javascript js mjs;
    text/css css;
    application/json json;
    application/wasm wasm;
    application/octet-stream data bin usd usdc usdz;
    text/plain usda;
  }
}
